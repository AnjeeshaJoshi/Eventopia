name: ems_app
description: HELP Events – Event Management System
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.3.3
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  confetti: ^0.7.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"
  min_sdk_android: 21



flutter:
  uses-material-design: true
  assets:
   - assets/images/