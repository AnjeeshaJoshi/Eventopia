name: ems_app
description: HELP Events – Event Management System
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  uuid: ^4.3.3
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  confetti: ^0.7.0
  mobile_scanner: ^7.2.0
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.4
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"
  min_sdk_android: 21
  # Adaptive icons configuration for Android 8.0+
  adaptive_icon_background: "#FFFFFF" # Set to "#FFFFFF" (white) or "#7C3AED" (violet brand color)
  adaptive_icon_foreground: "assets/images/logo1.png"
  # Decrease this value (default is 16) to zoom/scale the logo. Set to 0 to make it largest.
  adaptive_icon_foreground_inset: 0



flutter:
  generate: true
  uses-material-design: true
  assets:
   - assets/images/